<!-- UI layer: React components only. Math comes from the scripts above. -->
<script type="text/babel" data-presets="react-classic">
window.__eulerBooted = true;
const { useState, useEffect, useMemo, useRef } = React;
const {
  THEME, fmt, CMAP, niceTicks, useCanvas, useSmoothRange, finiteRange, usePlayer, useShortcuts,
  NumField, SelectField, Section, Segmented, Toggle, PlotCard, Transport, TopBar, HelpDrawer, Colorbar, Probe,
  downloadText, pickTextFile, numericTable, runSliced
} = LabUI;

// n significant figures (exponent form for very large / small magnitudes)
const sig = (v, n) => !Number.isFinite(v) ? "—"
  : (Math.abs(v) >= 1e6 || (Math.abs(v) < 1e-3 && v !== 0)) ? v.toExponential(n - 1) : String(+v.toPrecision(n));
const FLUX_OPTIONS = ["HLLC", "HLL", "Roe", "Rusanov"];
const FRAMES_1D = 300;       // recorded frames per run (scrub resolution)
const CFL_SAFE = 0.5;        // MUSCL + SSP-RK2 practical limit (CLAUDE.md §4)


// Index of the cell containing domain position x (cells of width dx from 0).
function cellAt(x, dx, N) { return Math.max(0, Math.min(N - 1, Math.floor(x / dx))); }

// Reject a state the solver can't continue from: NaN, or non-positive rho / p.
function check1D(s) {
  const { rho, mom, ene, N, rY } = s;
  const eos = s.eos || idealEos(s.gamma);
  for (let i = 2; i < N + 2; i++) {
    if (!(rho[i] > 0)) return "Density became non-positive or NaN";
    const q = eos.prim(rho[i], mom[i], ene[i], rY ? rY[i] : undefined);
    if (!(q.p > 0) || !Number.isFinite(q.T)) return "Pressure became negative or NaN";
  }
  return null;
}
const recordConserved = s => ({ rho: s.rho.slice(), mom: s.mom.slice(), ene: s.ene.slice(), rY: s.rY ? s.rY.slice() : null });

// Draw a scalar field as a smooth colour strip: one texel per cell, stretched
// by drawImage with bilinear filtering so motion reads continuously.
function drawFieldStrip(ctx, field, lo, hi, x0, y0, w, h, clipPath) {
  const N = field.length;
  const off = drawFieldStrip.off || (drawFieldStrip.off = document.createElement("canvas"));
  if (off.width !== N) { off.width = N; off.height = 1; }
  const octx = off.getContext("2d");
  const img = octx.createImageData(N, 1), d = img.data;
  const inv = 1 / Math.max(hi - lo, 1e-12);
  for (let i = 0; i < N; i++) {
    const k = 3 * Math.max(0, Math.min(255, Math.round((field[i] - lo) * inv * 255)));
    d[4 * i] = CMAP[k]; d[4 * i + 1] = CMAP[k + 1]; d[4 * i + 2] = CMAP[k + 2]; d[4 * i + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  ctx.save();
  if (clipPath) { clipPath(ctx); ctx.clip(); }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, 0, 0, N, 1, x0, y0, w, h);
  ctx.restore();
}

function schlieren(rho) {
  const N = rho.length, out = new Array(N);
  for (let i = 0; i < N; i++) {
    const iL = Math.max(0, i - 1), iR = Math.min(N - 1, i + 1);
    out[i] = Math.sqrt(Math.abs(rho[iR] - rho[iL]));   // sqrt stretch: weak waves stay visible
  }
  return out;
}

// ============================================================
// Lagrangian tracers: advected with the displayed velocity while the
// frame moves forward in small steps; frozen across seeks; re-seeded per run.
// ============================================================
const TRACERS = 220;
function useTracers(sol, frame, L, runId, maxJump) {
  const st = useRef({ run: null, t: null, frame: null, pts: [] });
  const s = st.current;
  if (!sol || !frame) return s.pts;
  if (s.run !== runId) {
    s.run = runId; s.t = frame.t; s.frame = frame; s.pts = [];
    for (let i = 0; i < TRACERS; i++) {
      const x = Math.random() * L;
      s.pts.push({ x, prevX: x, y: 0.12 + Math.random() * 0.76 });
    }
    return s.pts;
  }
  if (s.frame === frame) return s.pts;
  const dt = frame.t - s.t;
  s.frame = frame; s.t = frame.t;
  if (dt <= 0 || dt > maxJump) { for (const p of s.pts) p.prevX = p.x; return s.pts; }
  const N = sol.x.length, dx = L / N;
  for (const p of s.pts) {
    p.prevX = p.x;
    p.x += sol.u[cellAt(p.x, dx, N)] * dt;
    if (p.x < 0 || p.x > L) { p.x = Math.random() * L; p.prevX = p.x; p.y = 0.12 + Math.random() * 0.76; }
  }
  return s.pts;
}

// ============================================================
// Shock tube view: field strip + tracers + probe line
// ============================================================
function TubeView({ sol, field, lo, hi, L, diaphragm, showDiaphragm, tracers, hoverX, onHover }) {
  const geo = useRef(null);
  const ref = useCanvas((ctx, W, H) => {
    const padX = 14, padT = 12, padB = 20;
    const tx = padX, ty = padT, tw = W - 2 * padX, th = H - padT - padB;
    geo.current = { tx, tw };
    ctx.fillStyle = THEME.stage; ctx.fillRect(0, 0, W, H);
    if (!sol) return;
    drawFieldStrip(ctx, field, lo, hi, tx, ty, tw, th);

    // tube-wall shading
    const g = ctx.createLinearGradient(0, ty, 0, ty + th);
    g.addColorStop(0, "rgba(0,0,0,0.28)"); g.addColorStop(0.5, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.28)");
    ctx.fillStyle = g; ctx.fillRect(tx, ty, tw, th);

    if (tracers) {
      ctx.lineCap = "round";
      for (const p of tracers) {
        const x1 = tx + (p.prevX / L) * tw, x2 = tx + (p.x / L) * tw, y = ty + p.y * th;
        if (Math.abs(x2 - x1) < 0.4) {
          ctx.fillStyle = "rgba(20,18,16,0.55)";
          ctx.beginPath(); ctx.arc(x2, y, 1, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = "rgba(20,18,16,0.7)"; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
          ctx.fillStyle = "#8b3a2f";
          ctx.beginPath(); ctx.arc(x2, y, 1.3, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    if (showDiaphragm) {
      const dxp = tx + (diaphragm / L) * tw;
      ctx.strokeStyle = THEME.accent; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(dxp, ty - 4); ctx.lineTo(dxp, ty + th + 4); ctx.stroke(); ctx.setLineDash([]);
    }
    if (hoverX != null) {
      const hx = Math.round(tx + (hoverX / L) * tw) + 0.5;
      ctx.strokeStyle = THEME.cursor; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(hx, ty - 5); ctx.lineTo(hx, ty + th + 5); ctx.stroke();
    }
    ctx.strokeStyle = THEME.axis; ctx.lineWidth = 1;
    ctx.strokeRect(tx + 0.5, ty + 0.5, tw - 1, th - 1);
    ctx.font = THEME.font; ctx.fillStyle = THEME.tick; ctx.textBaseline = "top";
    ctx.textAlign = "left";  ctx.fillText("x = 0", tx, ty + th + 6);
    ctx.textAlign = "right"; ctx.fillText("x = " + L, tx + tw, ty + th + 6);
  }, [sol, field, lo, hi, L, diaphragm, showDiaphragm, tracers, hoverX]);

  const onMove = e => {
    const g = geo.current; if (!g) return;
    const r = e.currentTarget.getBoundingClientRect();
    const f = (e.clientX - r.left - g.tx) / g.tw;
    onHover(f < 0 || f > 1 ? null : f * L);
  };
  return <canvas ref={ref} className="stage-canvas" style={{ height: 132 }}
                 onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={e => e.pointerType !== "touch" && onHover(null)} />;
}

// Keyboard shortcuts shared by both 1D workspaces.
function usePlayerKeys(player, stale, run, onHelp) {
  useShortcuts({
    "Enter": () => run("solve"),
    " ": () => (player && !stale ? player.toggle() : run("play")),
    "ArrowLeft": () => player && player.stepFrame(-1),
    "ArrowRight": () => player && player.stepFrame(1),
    "Home": () => player && player.seek(0),
    "End": () => player && player.seek(player.tEnd),
    "?": onHelp
  });
}

// ============================================================
// Shock tube workspace
// ============================================================
// Gases and units
// ============================================================
const GAS_NAMES = Object.keys(GASES);
const REAL_GAS_OPTIONS = GAS_NAMES.map(k => ({ value: k, label: GASES[k].label }));
const GAS_OPTIONS = [{ value: "ideal", label: "Ideal γ (non-dimensional)" }].concat(REAL_GAS_OPTIONS);
const THERMO_OPTIONS = [
  { value: "thermally-perfect",   label: "thermally perfect, γ(T)" },
  { value: "calorically-perfect", label: "calorically perfect, γ at 298 K" }
];
const KPA = 1e-3, MS = 1e3, CM2 = 1e4;     // display scales: Pa → kPa, s → ms, m² → cm²
const T_WARN = 2500;                        // K: above this, frozen non-dissociating gas is a poor model
const safeName = s => String(s || "case").replace(/[^A-Za-z0-9._-]+/g, "_");

// Case-file buttons shared by the workspaces.
function CaseSection({ onSave, onLoad, onExport, exportLabel }) {
  return (
    <Section title="Case & export">
      <div className="grid-2">
        <button className="btn" onClick={onSave} title="Download this setup as a JSON case (runs with node run.js)">Save case</button>
        <button className="btn" onClick={onLoad} title="Load a JSON case file">Load case…</button>
      </div>
      <button className="btn" onClick={onExport} title="Download the fields at the current time as CSV">{exportLabel || "Export CSV (current time)"}</button>
      <div className="note">Saved cases run headless: <code>node run.js case.json</code></div>
    </Section>
  );
}

// ============================================================
// Shock tube workspace
// ============================================================
const ST_SI_PRESETS = {
  "Air 10:1 bar":           { gasL: "air", gasR: "air", left: { p: 10e5, T: 300, u: 0 },  right: { p: 1e5, T: 300, u: 0 }, L: 1, x0: 0.5, tEnd: 6e-4 },
  "He → air (two gases)":   { gasL: "He",  gasR: "air", left: { p: 20e5, T: 300, u: 0 },  right: { p: 1e4, T: 300, u: 0 }, L: 1, x0: 0.5, tEnd: 2.5e-4 },
  "Hot CO₂ (γ(T) matters)": { gasL: "CO2", gasR: "CO2", left: { p: 20e5, T: 1500, u: 0 }, right: { p: 1e5, T: 300, u: 0 }, L: 1, x0: 0.5, tEnd: 5e-4 }
};

function stDefaults() {
  const p = PRESETS["Sod"];
  return { preset: "Sod", gasL: "ideal", gasR: "ideal", thermo: "thermally-perfect",
           ndLeft: p.L, ndRight: p.R, siLeft: ST_SI_PRESETS["Air 10:1 bar"].left, siRight: ST_SI_PRESETS["Air 10:1 bar"].right,
           N: 400, L: 1, tEnd: p.tEnd, gamma: 1.4, cfl: 0.4, x0: p.diaphragm, bc: "transmissive", flux: "HLLC" };
}
function stFromCase(c) {
  const d = stDefaults(), n = c.numerics || {};
  const g = c.gas, legacy = !c.gasLeft && g && typeof g.gamma === "number";
  const name = x => (typeof x === "string" ? x : x && x.name);
  const model = (c.gas && c.gas.model) || (c.gasLeft && c.gasLeft.model) || c.thermo || d.thermo;
  return Object.assign(d, {
    preset: c.name || null,
    gasL: legacy ? "ideal" : name(c.gasLeft || g), gasR: legacy ? "ideal" : name(c.gasRight || g), thermo: model,
    gamma: legacy ? g.gamma : d.gamma,
    ndLeft: legacy ? c.left : d.ndLeft, ndRight: legacy ? c.right : d.ndRight,
    siLeft: legacy ? d.siLeft : c.left, siRight: legacy ? d.siRight : c.right,
    N: n.N || d.N, cfl: n.cfl || d.cfl, flux: n.flux || d.flux, L: c.L, x0: c.diaphragm, tEnd: c.tEnd, bc: c.bc || d.bc
  });
}

function ShockTubeApp({ onHelp, initialCase, onLoadCase }) {
  const init = useMemo(() => (initialCase ? stFromCase(initialCase) : stDefaults()), []);
  const [preset, setPreset]       = useState(init.preset);
  const [gasL, setGasL]           = useState(init.gasL);
  const [gasR, setGasR]           = useState(init.gasR);
  const [thermo, setThermo]       = useState(init.thermo);
  const [ndLeft, setNdLeft]       = useState(init.ndLeft);
  const [ndRight, setNdRight]     = useState(init.ndRight);
  const [siLeft, setSiLeft]       = useState(init.siLeft);
  const [siRight, setSiRight]     = useState(init.siRight);
  const [N, setN]                 = useState(init.N);
  const [Ldom, setLdom]           = useState(init.L);
  const [tEnd, setTEnd]           = useState(init.tEnd);
  const [gamma, setGamma]         = useState(init.gamma);
  const [cfl, setCfl]             = useState(init.cfl);
  const [diaphragm, setDiaphragm] = useState(init.x0);
  const [bcType, setBcType]       = useState(init.bc);
  const [flux, setFlux]           = useState(init.flux);
  const [overlay, setOverlay]     = useState(true);
  const [tubeMode, setTubeMode]   = useState("density");
  const [showDerived, setShowDerived] = useState(true);
  const [showTracers, setShowTracers] = useState(true);
  const [hoverX, setHoverX]       = useState(null);
  const [err, setErr]             = useState(null);

  const [player, startPlayer] = usePlayer();
  const solved = useRef({ key: null, spec: null, run: 0 });

  const legacy = gasL === "ideal";
  // Serializable description of the setup (gases by name); params are built from it.
  const spec = useMemo(() => ({
    legacy, gasL: legacy ? null : gasL, gasR: legacy ? null : (gasR === "ideal" ? gasL : gasR), thermo,
    left: legacy ? ndLeft : siLeft, right: legacy ? ndRight : siRight,
    N, L: Ldom, tEnd, gamma, cfl, diaphragm, bcType, flux
  }), [legacy, gasL, gasR, thermo, ndLeft, ndRight, siLeft, siRight, N, Ldom, tEnd, gamma, cfl, diaphragm, bcType, flux]);
  const stale = !!player && solved.current.key !== JSON.stringify(spec);

  const gasesOf = S => S.legacy ? null : { L: gasModel(S.gasL, S.thermo), R: gasModel(S.gasR, S.thermo) };
  const buildParams = S => {
    const base = { N: S.N, L: S.L, tEnd: S.tEnd, cfl: S.cfl, diaphragm: S.diaphragm, leftState: S.left, rightState: S.right,
                   bcType: S.bcType, flux: S.flux };
    if (S.legacy) return Object.assign(base, { gamma: S.gamma });
    const g = gasesOf(S);
    return Object.assign(base, S.gasL === S.gasR ? { gas: g.L } : { gasLeft: g.L, gasRight: g.R });
  };

  const validate = S => {
    const st = [S.left, S.right];
    if (S.legacy) {
      if (!st.every(s => s.rho > 0)) return "Density must be positive.";
      if (!(S.gamma > 1)) return "γ must be greater than 1.";
    } else if (!st.every(s => s.T > 0)) return "Temperature must be positive.";
    if (!st.every(s => s.p > 0))                       return "Pressure must be positive.";
    if (!(S.cfl > 0 && S.cfl <= 0.9))                  return "CFL must be in (0, 0.9].";
    if (!(S.N >= 20 && S.N <= 2000))                   return "N must be between 20 and 2000.";
    if (!(S.tEnd > 0))                                 return "t_end must be positive.";
    if (!(S.L > 0))                                    return "L must be positive.";
    if (!(S.diaphragm > 0 && S.diaphragm < S.L))       return "The diaphragm must lie inside the domain.";
    return null;
  };

  const run = (mode, S) => {
    S = S || spec;
    const e = validate(S); setErr(e); if (e) return;
    solved.current = { key: JSON.stringify(S), spec: S, run: solved.current.run + 1 };
    const P = buildParams(S);
    startPlayer({
      tEnd: S.tEnd, maxFrames: FRAMES_1D, playSeconds: 6,
      init: () => initState(P),
      advance: (s, t) => stepUntil(s, t),
      stableDt,
      record: recordConserved,
      check: check1D
    }, mode);
  };

  const loadPreset = name => {
    const q = PRESETS[name];
    setPreset(name); setGasL("ideal"); setGasR("ideal"); setNdLeft(q.L); setNdRight(q.R); setTEnd(q.tEnd); setDiaphragm(q.diaphragm); setLdom(1);
    run("solve", Object.assign({}, spec, { legacy: true, gasL: null, gasR: null, left: q.L, right: q.R, tEnd: q.tEnd, diaphragm: q.diaphragm, L: 1 }));
  };
  const loadSiPreset = name => {
    const q = ST_SI_PRESETS[name];
    setPreset(name); setGasL(q.gasL); setGasR(q.gasR); setSiLeft(q.left); setSiRight(q.right);
    setTEnd(q.tEnd); setDiaphragm(q.x0); setLdom(q.L);
    run("solve", Object.assign({}, spec, { legacy: false, gasL: q.gasL, gasR: q.gasR, left: q.left, right: q.right,
                                            tEnd: q.tEnd, diaphragm: q.x0, L: q.L }));
  };

  useEffect(() => { run("solve"); /* eslint-disable-next-line */ }, []);
  usePlayerKeys(player, stale, run, onHelp);

  // ---- what to show: the frame under the playback cursor ----
  const SP = solved.current.spec;
  const frame = player ? player.current() : null;
  const meta = useMemo(() => (player && player.sim ? player.sim : null), [player]);
  const sol = useMemo(() => {
    if (!frame || !SP || !meta) return null;
    return extract(Object.assign({}, meta, frame.snap));
  }, [frame, SP, meta]);

  // Real-gas exact Riemann problem: solved once per run, sampled per frame.
  const exactSolved = useMemo(() => {
    if (!SP || SP.legacy) return null;
    const g = gasesOf(SP);
    try { return riemannGasSolve(g.L, SP.left, g.R, SP.right); } catch (e) { return null; }
  }, [SP]);
  const exact = useMemo(() => {
    if (!sol || !overlay || SP.bcType !== "transmissive") return null;
    if (!SP.legacy) {
      if (!exactSolved) return null;
      const g = gasesOf(SP);
      return exactRiemannGas(g.L, SP.left, g.R, SP.right, SP.diaphragm, frame.t, sol.x, exactSolved);
    }
    const ex = exactRiemann(SP.left, SP.right, SP.gamma, SP.diaphragm, frame.t, sol.x);
    if (!ex) return null;
    const n = ex.rho.length, g = SP.gamma;
    const d = { M: new Array(n), T: new Array(n), s: new Array(n), a: new Array(n), e: new Array(n) };
    for (let i = 0; i < n; i++) {
      const r = Math.max(ex.rho[i], 1e-12), p = Math.max(ex.p[i], 1e-12);
      const a = Math.sqrt(g * p / r);
      d.a[i] = a; d.M[i] = ex.u[i] / a; d.T[i] = p / r;
      d.s[i] = Math.log(p / Math.pow(r, g)); d.e[i] = p / ((g - 1) * r);
    }
    return Object.assign(ex, d);
  }, [sol, overlay, SP, exactSolved]);

  const field = useMemo(() => !sol ? null
    : tubeMode === "pressure" ? sol.p
    : tubeMode === "Mach" ? sol.M
    : tubeMode === "temperature" ? sol.T
    : tubeMode === "schlieren" ? schlieren(sol.rho)
    : sol.rho, [sol, tubeMode]);
  const [flo, fhi] = finiteRange([field]);
  const [lo, hi] = useSmoothRange(flo, fhi, solved.current.run + tubeMode);
  const tracers = useTracers(showTracers ? sol : null, frame, SP ? SP.L : 1, solved.current.run,
                             SP ? 4 * SP.tEnd / FRAMES_1D : 0);

  const si = SP && !SP.legacy;
  const U = si ? { p: " kPa", T: " K", u: " m/s", x: " m" } : { p: "", T: "", u: "", x: "" };
  let probe = null, where = "";
  if (sol && hoverX != null) {
    const i = cellAt(hoverX, SP.L / SP.N, SP.N);
    where = "x = " + sig(sol.x[i], 3) + U.x;
    probe = [["ρ", sol.rho[i]], ["u", sol.u[i]], ["p", si ? sol.p[i] * KPA : sol.p[i]], ["T", sol.T[i]], ["M", sol.M[i]]];
    if (sol.Y) probe.push(["Y", sol.Y[i]]);
  }

  // ---- case files ----
  const toCase = S => {
    const c = { kind: "shocktube", name: preset || "shocktube", L: S.L, diaphragm: S.diaphragm, bc: S.bcType,
                left: S.left, right: S.right, numerics: { N: S.N, cfl: S.cfl, flux: S.flux }, tEnd: S.tEnd };
    if (S.legacy) c.gas = { gamma: S.gamma };
    else if (S.gasL === S.gasR) c.gas = { name: S.gasL, model: S.thermo };
    else { c.gasLeft = { name: S.gasL, model: S.thermo }; c.gasRight = { name: S.gasR, model: S.thermo }; }
    return c;
  };
  const saveCase = () => downloadText(safeName(preset) + ".json", JSON.stringify(toCase(spec), null, 2) + "\n", "application/json");
  const exportCSV = () => {
    if (!sol) return;
    const header = ["case: " + (preset || "shocktube") + " (shocktube)", "t = " + frame.t + " s"];
    downloadText(safeName(preset) + "_t=" + frame.t.toExponential(3) + ".csv", fieldsToCSV(sol, { header, si }), "text/csv");
  };

  const resetKey = solved.current.run;
  const plot = (title, key, scale) => (
    <PlotCard key={key} title={title} x={sol.x} y={sol[key]} yScale={scale}
              refY={exact && exact[key] ? exact[key] : null} refLabel="exact Riemann"
              hoverX={hoverX} onHover={setHoverX} resetKey={resetKey} />
  );
  const modeLabel = { density: "density ρ", schlieren: "schlieren |∂ρ/∂x|", pressure: "pressure p",
                      temperature: "temperature T", Mach: "Mach M" }[tubeMode];
  const hotWarning = si && sol && Math.max(...sol.T) > T_WARN;

  const stateFields = (st, set, side) => legacy ? (
    <div className="grid-3">
      <NumField label="ρ" value={st.rho} onChange={v => set({ ...st, rho: v })} />
      <NumField label="u" value={st.u}   onChange={v => set({ ...st, u: v })} />
      <NumField label="p" value={st.p}   onChange={v => set({ ...st, p: v })} />
