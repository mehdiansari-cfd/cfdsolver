name: tests

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step: the project is dependency-free and the suite uses
      # only Node's built-in modules.
      - name: Run verification suite
        run: node test.js
