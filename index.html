<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1D Euler Shock Tube Laboratory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: #efe9d8; }
  body { font-family: 'JetBrains Mono', monospace; }
  .grain { background-image: radial-gradient(rgba(28,26,23,0.04) 1px, transparent 1px); background-size: 3px 3px; }
  .btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
         text-transform: uppercase; padding: 7px 12px; border: 1px solid #1c1a17;
         background: #f7f2e3; color: #1c1a17; cursor: pointer;
         transition: background 120ms, color 120ms; }
  .btn:hover:not(:disabled) { background: #1c1a17; color: #efe9d8; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #8b3a2f; border-color: #8b3a2f; color: #efe9d8; }
  .btn-primary:hover:not(:disabled) { background: #1c1a17; border-color: #1c1a17; color: #efe9d8; }
  .smallcaps { font-variant: small-caps; letter-spacing: 0.12em; }
  select { font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 5px 7px;
           background: #f7f2e3; border: 1px solid #1c1a17; border-radius: 0; outline: none; color: #1c1a17; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>

<!-- React + Babel from CDN (UI rendering only) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- CFD solver (math layer, no DOM). Must load BEFORE the UI script. -->
<script src="solver.js"></script>
</head>
<body>
<div id="root">
  <div style="padding: 40px; font-family: 'JetBrains Mono', monospace; color: #5a5547;">
    Loading...
  </div>
</div>

<!-- UI layer: React components only. Math comes from solver.js globals. -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Canvas tube view (density field + velocity streaks) ----------
function TubeView({ result, params, info }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const cv = canvasRef.current;
    if (!cv || !result) return;
    const ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const cssW = cv.clientWidth, cssH = cv.clientHeight;
    if (cv.width !== cssW * dpr || cv.height !== cssH * dpr) {
      cv.width = cssW * dpr; cv.height = cssH * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;

    const W = cssW, H = cssH;
    const padX = 12, padTop = 14, padBot = 14;
    const tubeX = padX, tubeY = padTop;
    const tubeW = W - 2 * padX, tubeH = H - padTop - padBot;

    ctx.fillStyle = "#efe9d8"; ctx.fillRect(0, 0, W, H);

    const N = result.x.length, rho = result.rho;
    let minR = Infinity, maxR = -Infinity;
    for (let i = 0; i < N; i++) { if (rho[i] < minR) minR = rho[i]; if (rho[i] > maxR) maxR = rho[i]; }
    const range = Math.max(maxR - minR, 1e-12);
    const cellW = tubeW / N;
    for (let i = 0; i < N; i++) {
      const norm = (rho[i] - minR) / range;
      const v = Math.round(247 - norm * 215);
      ctx.fillStyle = "rgb(" + v + "," + Math.max(0, v - 6) + "," + Math.max(0, v - 18) + ")";
      ctx.fillRect(tubeX + i * cellW, tubeY, cellW + 0.6, tubeH);
    }
    const grad = ctx.createLinearGradient(0, tubeY, 0, tubeY + tubeH);
    grad.addColorStop(0, "rgba(0,0,0,0.18)");
    grad.addColorStop(0.5, "rgba(0,0,0,0.0)");
    grad.addColorStop(1, "rgba(0,0,0,0.18)");
    ctx.fillStyle = grad; ctx.fillRect(tubeX, tubeY, tubeW, tubeH);

    if (result.particles && result.particles.length) {
      ctx.lineCap = "round";
      for (const p of result.particles) {
        const x1 = tubeX + (p.prevX / params.L) * tubeW;
        const x2 = tubeX + (p.x     / params.L) * tubeW;
        const y  = tubeY + p.y * tubeH;
        const len = Math.abs(x2 - x1);
        if (len < 0.3) {
          ctx.fillStyle = "rgba(28,26,23,0.55)";
          ctx.beginPath(); ctx.arc(x2, y, 0.9, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = "rgba(28,26,23,0.65)";
          ctx.lineWidth = 1.1;
          ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
          ctx.fillStyle = "#8b3a2f";
          ctx.beginPath(); ctx.arc(x2, y, 1.1, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    if (info.t === 0) {
      const dx = tubeX + (params.diaphragm / params.L) * tubeW;
      ctx.strokeStyle = "#8b3a2f"; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(dx, tubeY - 4); ctx.lineTo(dx, tubeY + tubeH + 4); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = "#1c1a17"; ctx.lineWidth = 1.5;
    ctx.strokeRect(tubeX + 0.5, tubeY + 0.5, tubeW - 1, tubeH - 1);
    ctx.beginPath();
    ctx.moveTo(tubeX, tubeY - 3); ctx.lineTo(tubeX, tubeY + tubeH + 3);
    ctx.moveTo(tubeX + tubeW, tubeY - 3); ctx.lineTo(tubeX + tubeW, tubeY + tubeH + 3);
    ctx.stroke();

    ctx.font = "9px JetBrains Mono, monospace";
    ctx.fillStyle = "#5a5547";
    ctx.textAlign = "left";  ctx.fillText("x = 0", tubeX, tubeY + tubeH + 11);
    ctx.textAlign = "right"; ctx.fillText("x = " + params.L, tubeX + tubeW, tubeY + tubeH + 11);
    ctx.textAlign = "left";
    ctx.fillText("rho \u2208 [" + minR.toFixed(3) + ", " + maxR.toFixed(3) + "]", tubeX, tubeY - 4);
  }, [result, params, info]);
  return <canvas ref={canvasRef} style={{ width: "100%", height: 120, display: "block", background: "#efe9d8" }} />;
}

// ---------- SVG line plot ----------
function Plot({ x, y, label, color }) {
  const W = 360, H = 200;
  const pad = { l: 48, r: 12, t: 24, b: 28 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  let yMin = Infinity, yMax = -Infinity;
  for (let i = 0; i < y.length; i++) { if (y[i] < yMin) yMin = y[i]; if (y[i] > yMax) yMax = y[i]; }
  const yPad = Math.max((yMax - yMin) * 0.08, 1e-6);
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const xMin = x[0], xMax = x[x.length - 1];
  const toX = v => pad.l + ((v - xMin) / (xMax - xMin)) * pw;
  const toY = v => pad.t + (1 - (v - yLo) / (yHi - yLo)) * ph;
  let path = "";
  for (let i = 0; i < x.length; i++) {
    path += (i === 0 ? "M" : "L") + toX(x[i]).toFixed(2) + " " + toY(y[i]).toFixed(2);
  }
  const fmt = v => {
    const a = Math.abs(v);
    if (a === 0) return "0";
    if (a < 0.01 || a >= 1000) return v.toExponential(1);
    return v.toFixed(a < 1 ? 3 : 2);
  };
  return (
    <svg viewBox={"0 0 " + W + " " + H} style={{ display: "block", width: "100%" }}>
      <rect x={pad.l} y={pad.t} width={pw} height={ph} fill="#f7f2e3" stroke="#1c1a17" strokeWidth="0.6" />
      {[0.25, 0.5, 0.75].map((f, i) => (
        <line key={"v" + i} x1={pad.l + f * pw} x2={pad.l + f * pw} y1={pad.t} y2={pad.t + ph}
              stroke="#c8c0aa" strokeWidth="0.4" strokeDasharray="2 3" />
      ))}
      {[0.25, 0.5, 0.75].map((f, i) => (
        <line key={"h" + i} x1={pad.l} x2={pad.l + pw} y1={pad.t + f * ph} y2={pad.t + f * ph}
              stroke="#c8c0aa" strokeWidth="0.4" strokeDasharray="2 3" />
      ))}
      <path d={path} fill="none" stroke={color} strokeWidth="1.6" strokeLinejoin="round" />
      <text x={pad.l} y={pad.t - 8} fontFamily="Fraunces, serif" fontSize="13" fontStyle="italic" fill="#1c1a17">{label}</text>
      <text x={pad.l - 6} y={toY(yHi) + 4} fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#5a5547" textAnchor="end">{fmt(yHi)}</text>
      <text x={pad.l - 6} y={toY(yLo) + 4} fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#5a5547" textAnchor="end">{fmt(yLo)}</text>
      <text x={toX(xMin)} y={pad.t + ph + 14} fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#5a5547" textAnchor="start">{xMin.toFixed(2)}</text>
      <text x={toX(xMax)} y={pad.t + ph + 14} fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#5a5547" textAnchor="end">{xMax.toFixed(2)}</text>
      <text x={pad.l + pw / 2} y={H - 4} fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#5a5547" textAnchor="middle">x</text>
    </svg>
  );
}

// ---------- Numeric input field ----------
function NumField({ label, value, onChange, step }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 3, fontFamily: "JetBrains Mono, monospace", fontSize: 11, color: "#1c1a17" }}>
      <span style={{ letterSpacing: "0.08em", textTransform: "uppercase", color: "#5a5547", fontSize: 9 }}>{label}</span>
      <input type="number" value={value} step={step || 0.1}
        onChange={e => onChange(parseFloat(e.target.value))}
        style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13, padding: "5px 7px",
          background: "#f7f2e3", border: "1px solid #1c1a17", color: "#1c1a17",
          borderRadius: 0, outline: "none", width: "100%" }} />
    </label>
  );
}

// ---------- Main app ----------
function App() {
  const [leftState, setLeftState]   = useState(PRESETS["Sod"].L);
  const [rightState, setRightState] = useState(PRESETS["Sod"].R);
  const [N, setN]                   = useState(300);
  const [Ldom, setLdom]             = useState(1.0);
  const [tEnd, setTEnd]             = useState(PRESETS["Sod"].tEnd);
  const [gamma, setGamma]           = useState(1.4);
  const [cfl, setCfl]               = useState(0.4);
  const [diaphragm, setDiaphragm]   = useState(PRESETS["Sod"].diaphragm);
  const [bcType, setBcType]         = useState("transmissive");

  const [result, setResult] = useState(null);
  const [info, setInfo]     = useState({ t: 0, step: 0, ms: 0 });
  const [busy, setBusy]     = useState(false);
  const [err, setErr]       = useState(null);
  const [animating, setAnimating] = useState(false);
  const stateRef     = useRef(null);
  const particlesRef = useRef([]);
  const rafRef       = useRef(null);

  const params = useMemo(() => ({
    N, L: Ldom, tEnd, gamma, cfl, diaphragm, leftState, rightState, bcType
  }), [N, Ldom, tEnd, gamma, cfl, diaphragm, leftState, rightState, bcType]);

  const validate = () => {
    if (leftState.rho <= 0 || rightState.rho <= 0) return "Density must be positive.";
    if (leftState.p   <= 0 || rightState.p   <= 0) return "Pressure must be positive.";
    if (gamma <= 1)                                 return "gamma must be greater than 1.";
    if (cfl <= 0 || cfl > 0.9)                      return "CFL must be in (0, 0.9].";
    if (N < 20 || N > 1500)                         return "N must be between 20 and 1500.";
    if (tEnd <= 0)                                  return "Final time must be positive.";
    if (diaphragm <= 0 || diaphragm >= Ldom)        return "Diaphragm must lie inside the domain.";
    return null;
  };

  const stopAnim = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
    setAnimating(false);
  };

  const seedParticles = (L) => {
    const M = 220;
    const arr = [];
    for (let i = 0; i < M; i++) {
      const x = Math.random() * L;
      arr.push({ x, prevX: x, y: 0.12 + Math.random() * 0.76 });
    }
    particlesRef.current = arr;
  };

  const runFinal = () => {
    stopAnim();
    const e = validate(); if (e) { setErr(e); return; }
    setErr(null); setBusy(true);
    particlesRef.current = [];
    setTimeout(() => {
      const t0 = performance.now();
      let s = initState(params);
      s = stepUntil(s, params.tEnd);
      const ms = performance.now() - t0;
      const ext = extract(s);
      ext.particles = null;
      setResult(ext);
      setInfo({ t: s.t, step: s.step, ms });
      setBusy(false);
    }, 10);
  };

  const animate = () => {
    stopAnim();
    const e = validate(); if (e) { setErr(e); return; }
    setErr(null);
    const t0 = performance.now();
    let s = initState(params);
    stateRef.current = s;
    seedParticles(params.L);

    const ext0 = extract(s);
    ext0.particles = particlesRef.current.map(p => ({ ...p }));
    setResult(ext0);
    setInfo({ t: 0, step: 0, ms: 0 });
    setAnimating(true);

    const FRAMES = 90;
    let frame = 0;
    const tick = () => {
      frame++;
      const tPrev  = stateRef.current.t;
      const target = Math.min(params.tEnd, (frame / FRAMES) * params.tEnd);
      stateRef.current = stepUntil(stateRef.current, target);
      const dt = stateRef.current.t - tPrev;

      for (const p of particlesRef.current) {
        p.prevX = p.x;
        const u = localVelocity(stateRef.current, p.x);
        p.x += u * dt;
        if (p.x < 0 || p.x > params.L) {
          const nx = Math.random() * params.L;
          p.x = nx; p.prevX = nx;
          p.y = 0.12 + Math.random() * 0.76;
        }
      }

      const ext = extract(stateRef.current);
      ext.particles = particlesRef.current.map(p => ({ ...p }));
      setResult(ext);
      setInfo({ t: stateRef.current.t, step: stateRef.current.step, ms: performance.now() - t0 });

      if (stateRef.current.t < params.tEnd) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        rafRef.current = null;
        setAnimating(false);
      }
    };
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => { runFinal(); /* eslint-disable-next-line */ }, []);

  const loadPreset = name => {
    stopAnim();
    const p = PRESETS[name];
    setLeftState(p.L); setRightState(p.R); setTEnd(p.tEnd); setDiaphragm(p.diaphragm);
  };

  const C = { rho: "#8b3a2f", u: "#2d5d6e", p: "#4a5d23", e: "#6a3d5e" };
  const hasStreaks = animating || (result && result.particles && result.particles.length);

  return (
    <div className="grain" style={{
      minHeight: "100vh", background: "#efe9d8", color: "#1c1a17",
      fontFamily: "JetBrains Mono, monospace", padding: "24px 22px 36px"
    }}>
      <header style={{ borderBottom: "1.5px solid #1c1a17", paddingBottom: 10, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8 }}>
          <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontStyle: "italic", fontSize: 34, lineHeight: 1, margin: 0 }}>
            1D Euler <span style={{ fontStyle: "normal", fontWeight: 400 }}>{"\u00b7 shock tube laboratory"}</span>
          </h1>
          <span className="smallcaps" style={{ fontSize: 10, color: "#5a5547" }}>{"HLLC \u00b7 MUSCL \u00b7 SSP-RK2"}</span>
        </div>
        <p style={{ margin: "6px 0 0", fontSize: 11, color: "#5a5547", maxWidth: 720 }}>
          Specify left/right gas states across the diaphragm, then run or animate. The tube view shows
          density inside the tube (dark = dense, light = rarefied) and during animation overlays short
          streaks tracing the local velocity field.
        </p>
      </header>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14, alignItems: "center" }}>
        <span className="smallcaps" style={{ fontSize: 10, color: "#5a5547", marginRight: 4 }}>{"presets \u203a"}</span>
        {Object.keys(PRESETS).map(name => (
          <button key={name} className="btn" onClick={() => loadPreset(name)}>{name}</button>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginBottom: 16 }}>
        <fieldset style={{ border: "1px solid #1c1a17", padding: "10px 12px 12px", margin: 0 }}>
          <legend className="smallcaps" style={{ fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: 13, padding: "0 6px" }}>
            left of diaphragm
          </legend>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <NumField label="rho" value={leftState.rho} onChange={v => setLeftState({ ...leftState, rho: v })} />
            <NumField label="u"   value={leftState.u}   onChange={v => setLeftState({ ...leftState, u: v })} />
            <NumField label="p"   value={leftState.p}   onChange={v => setLeftState({ ...leftState, p: v })} />
          </div>
        </fieldset>

        <fieldset style={{ border: "1px solid #1c1a17", padding: "10px 12px 12px", margin: 0 }}>
          <legend className="smallcaps" style={{ fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: 13, padding: "0 6px" }}>
            right of diaphragm
          </legend>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <NumField label="rho" value={rightState.rho} onChange={v => setRightState({ ...rightState, rho: v })} />
            <NumField label="u"   value={rightState.u}   onChange={v => setRightState({ ...rightState, u: v })} />
            <NumField label="p"   value={rightState.p}   onChange={v => setRightState({ ...rightState, p: v })} />
          </div>
        </fieldset>

        <fieldset style={{ border: "1px solid #1c1a17", padding: "10px 12px 12px", margin: 0 }}>
          <legend className="smallcaps" style={{ fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: 13, padding: "0 6px" }}>
            numerics & domain
          </legend>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <NumField label="gamma"   value={gamma} onChange={setGamma} step={0.05} />
            <NumField label="CFL"     value={cfl}   onChange={setCfl}   step={0.05} />
            <NumField label="N cells" value={N}     onChange={v => setN(Math.round(v))} step={50} />
            <NumField label="t end"   value={tEnd}  onChange={setTEnd}  step={0.01} />
            <NumField label="L"       value={Ldom}  onChange={setLdom}  step={0.1} />
            <NumField label="x_0"     value={diaphragm} onChange={setDiaphragm} step={0.05} />
          </div>
        </fieldset>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 14, padding: "10px 12px",
                     background: "#1c1a17", color: "#efe9d8" }}>
        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase" }}>
          <span>BCs</span>
          <select value={bcType} onChange={e => setBcType(e.target.value)} style={{ background: "#efe9d8", color: "#1c1a17" }}>
            <option value="transmissive">transmissive</option>
            <option value="reflective">reflective</option>
          </select>
        </label>
        <button className="btn btn-primary" onClick={runFinal} disabled={busy || animating}>
          {busy ? "computing..." : "run to t_end"}
        </button>
        <button className="btn" onClick={animate} disabled={busy || animating}
                style={{ background: animating ? "#8b3a2f" : "#efe9d8", color: animating ? "#efe9d8" : "#1c1a17" }}>
          {animating ? "animating..." : "animate flow"}
        </button>
        {animating && <button className="btn" onClick={stopAnim} style={{ background: "#efe9d8", color: "#1c1a17" }}>stop</button>}

        <div style={{ marginLeft: "auto", fontSize: 11, display: "flex", gap: 18, color: "#efe9d8" }}>
          <span><span style={{ color: "#a8a297" }}>t = </span>{info.t.toFixed(4)}</span>
          <span><span style={{ color: "#a8a297" }}>steps = </span>{info.step}</span>
          <span><span style={{ color: "#a8a297" }}>wall = </span>{info.ms.toFixed(0)} ms</span>
        </div>
      </div>

      {err && (
        <div style={{ padding: "8px 12px", border: "1px solid #8b3a2f", background: "#f7e4df", color: "#8b3a2f",
                        fontSize: 11, marginBottom: 12 }}>
          ! {err}
        </div>
      )}

      <div style={{ marginBottom: 14 }}>
        <div className="smallcaps" style={{ fontFamily: "Fraunces, serif", fontStyle: "italic", fontSize: 13, color: "#1c1a17", marginBottom: 4 }}>
          inside the tube {"\u00b7 density field"}{hasStreaks ? " + velocity streaks" : ""}
        </div>
        <div style={{ border: "1px solid #1c1a17" }}>
          {result && <TubeView result={result} params={params} info={info} />}
        </div>
      </div>

      {result && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, background: "#1c1a17", padding: 14 }}>
          <div style={{ background: "#efe9d8", padding: "6px 8px 0" }}>
            <Plot x={result.x} y={result.rho} label="density rho(x)"   color={C.rho} />
          </div>
          <div style={{ background: "#efe9d8", padding: "6px 8px 0" }}>
            <Plot x={result.x} y={result.u}   label="velocity u(x)"    color={C.u} />
          </div>
          <div style={{ background: "#efe9d8", padding: "6px 8px 0" }}>
            <Plot x={result.x} y={result.p}   label="pressure p(x)"    color={C.p} />
          </div>
          <div style={{ background: "#efe9d8", padding: "6px 8px 0" }}>
            <Plot x={result.x} y={result.e}   label="internal energy e(x)" color={C.e} />
          </div>
        </div>
      )}

      <footer style={{ marginTop: 16, paddingTop: 10, borderTop: "1px solid #c8c0aa", fontSize: 10, color: "#5a5547",
                        display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <span>dU/dt + dF(U)/dx = 0  {"\u00b7"}  U = [rho, rho*u, E]  {"\u00b7"}  E = p/(gamma-1) + (1/2)*rho*u^2</span>
        <span className="smallcaps">finite volume {"\u00b7"} 1D {"\u00b7"} ideal gas</span>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
