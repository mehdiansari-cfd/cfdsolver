<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15181d">
<title>Euler Lab · 2D</title>
<script>
  // Apply a saved light / dark choice before first paint (otherwise the system setting decides).
  try { var t = localStorage.getItem("eulerlab-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="lab.css?v=20261020">

<!-- React + Babel from CDN (UI rendering only). Versions are pinned so an
     upstream release can never change or break the page. -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>
  // Force the classic JSX runtime (React.createElement). The automatic runtime
  // emits `import ... "react/jsx-runtime"`, which a non-module page with UMD
  // React can't resolve — leaving the page stuck on "Loading...".
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
  });
</script>

<!-- Shared UI layer (playback engine, plots, controls). Needs React. -->
<script src="labui.js?v=20261020"></script>
<!-- 2D CFD solver (math layer, no DOM). Self-contained. -->
<script src="solver2d.js?v=20261020"></script>
</head>
<body>
<div id="root"><div class="boot">Loading...</div></div>

<!-- UI layer: React components only. Math comes from solver2d.js globals. -->
<script type="text/babel" data-presets="react-classic">
window.__eulerBooted = true;
const { useState, useEffect, useMemo, useRef } = React;
const {
  THEME, fmt, CMAP, useCanvas, useSmoothRange, finiteRange, usePlayer, useShortcuts,
  NumField, SelectField, Section, Segmented, Toggle, PlotCard, Transport, TopBar, HelpDrawer, Colorbar, Probe,
  downloadText
} = LabUI;

// Interior fields of a 2D snapshot as CSV, one row per cell (non-dimensional).
function fields2DToCSV(sol, t, preset) {
  const lines = ["# case: " + preset + " (2D, non-dimensional)", "# t = " + t, "x,y,rho,u,v,p,M"];
  const f = v => Number(v.toPrecision(9));
  for (let j = 0; j < sol.Ny; j++) {
    for (let i = 0; i < sol.Nx; i++) {
      const k = j * sol.Nx + i;
      lines.push([f(sol.xs[i]), f(sol.ys[j]), f(sol.rho[k]), f(sol.u[k]), f(sol.v[k]), f(sol.p[k]), f(sol.M[k])].join(","));
    }
  }
  return lines.join("\n") + "\n";
}

const FLUX_OPTIONS = ["HLLC", "HLL", "Roe", "Rusanov"];
const CFL_SAFE = 0.5;
// Recorded frames are Float32 copies of the four ghosted conserved arrays.
// Cap their total memory so big grids get fewer (not slower) frames.
const FRAME_MEMORY_BYTES = 96e6;
const MAX_FRAMES_2D = 200, MIN_FRAMES_2D = 24;

function framesFor(Nx, Ny) {
  const bytes = 4 * 4 * (Nx + 4) * (Ny + 4);
  return Math.max(MIN_FRAMES_2D, Math.min(MAX_FRAMES_2D, Math.floor(FRAME_MEMORY_BYTES / bytes)));
}
const record2D = s => ({ rho: new Float32Array(s.rho), mu: new Float32Array(s.mu),
                         mv: new Float32Array(s.mv), E: new Float32Array(s.E) });

function check2D(s) {
  const { rho, mu, mv, E, Nx, Ny, gamma } = s, Nxt = Nx + 4;
  for (let j = 2; j < Ny + 2; j++) {
    for (let i = 2, k = j * Nxt + 2; i < Nx + 2; i++, k++) {
      const r = rho[k];
      if (!(r > 0)) return "Density became non-positive or NaN";
      if (!((gamma - 1) * (E[k] - 0.5 * (mu[k] * mu[k] + mv[k] * mv[k]) / r) > 0)) return "Pressure became negative or NaN";
    }
  }
  return null;
}

// |∇ρ|^(1/2): numerical schlieren with one-sided differences at the edges.
function schlieren2D(sol) {
  const { Nx, Ny, rho } = sol, f = new Float64Array(Nx * Ny);
  for (let j = 0; j < Ny; j++) {
    const jB = Math.max(0, j - 1), jT = Math.min(Ny - 1, j + 1);
    for (let i = 0; i < Nx; i++) {
      const iL = Math.max(0, i - 1), iR = Math.min(Nx - 1, i + 1);
      const gx = rho[j * Nx + iR] - rho[j * Nx + iL];
      const gy = rho[jT * Nx + i] - rho[jB * Nx + i];
      f[j * Nx + i] = Math.sqrt(Math.sqrt(gx * gx + gy * gy));
    }
  }
  return f;
}

// ============================================================
// Heatmap: one texel per cell, scaled to fit with optional bilinear
// smoothing; dashed cut lines show where the line-outs are taken.
// Click to move the cuts; hover to probe.
// ============================================================
function Heatmap({ sol, field, lo, hi, Lx, Ly, smooth, cut, hover, onHover, onCut }) {
  const geo = useRef(null);
  const off = useRef(null);
  const ref = useCanvas((ctx, W, H) => {
    ctx.fillStyle = THEME.stage; ctx.fillRect(0, 0, W, H);
    if (!sol || !field) return;
    const { Nx, Ny } = sol;
    // fit the domain's aspect ratio inside the canvas
    const pad = 10, s = Math.min((W - 2 * pad) / Lx, (H - 2 * pad) / Ly);
    const iw = Lx * s, ih = Ly * s, ix = (W - iw) / 2, iy = (H - ih) / 2;
    geo.current = { ix, iy, iw, ih };

    const o = off.current || (off.current = document.createElement("canvas"));
    if (o.width !== Nx || o.height !== Ny) { o.width = Nx; o.height = Ny; }
    const octx = o.getContext("2d");
    const img = octx.createImageData(Nx, Ny), d = img.data;
    const inv = 1 / Math.max(hi - lo, 1e-12);
    for (let j = 0; j < Ny; j++) {
      const src = j * Nx, dst = (Ny - 1 - j) * Nx;       // flip: +y points up
      for (let i = 0; i < Nx; i++) {
        const k = 3 * Math.max(0, Math.min(255, Math.round((field[src + i] - lo) * inv * 255)));
        const q = 4 * (dst + i);
        d[q] = CMAP[k]; d[q + 1] = CMAP[k + 1]; d[q + 2] = CMAP[k + 2]; d[q + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = smooth;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(o, ix, iy, iw, ih);

    const X = x => ix + (x / Lx) * iw, Y = y => iy + (1 - y / Ly) * ih;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]); ctx.strokeStyle = "rgba(16,19,23,0.75)";
    ctx.beginPath();
    ctx.moveTo(ix, Math.round(Y(cut.y)) + 0.5); ctx.lineTo(ix + iw, Math.round(Y(cut.y)) + 0.5);
    ctx.moveTo(Math.round(X(cut.x)) + 0.5, iy); ctx.lineTo(Math.round(X(cut.x)) + 0.5, iy + ih);
    ctx.stroke(); ctx.setLineDash([]);
    if (hover) {
      ctx.strokeStyle = THEME.cursor;
      ctx.beginPath(); ctx.arc(X(hover.x), Y(hover.y), 5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = THEME.axis;
    ctx.strokeRect(ix + 0.5, iy + 0.5, iw - 1, ih - 1);
  }, [sol, field, lo, hi, Lx, Ly, smooth, cut, hover]);

  const toDomain = e => {
    const g = geo.current; if (!g) return null;
    const r = e.currentTarget.getBoundingClientRect();
    const fx = (e.clientX - r.left - g.ix) / g.iw, fy = (e.clientY - r.top - g.iy) / g.ih;
    if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return null;
    return { x: fx * Lx, y: (1 - fy) * Ly };
  };
  return <canvas ref={ref} className="stage-canvas" style={{ height: "min(68vh, 720px, calc(100vw - 32px))" }}
                 onPointerMove={e => onHover(toDomain(e))} onPointerLeave={e => e.pointerType !== "touch" && onHover(null)}
                 onClick={e => { const p = toDomain(e); if (p) onCut(p); }} />;
}

// ============================================================
// 2D workspace
// ============================================================
function App() {
  const P0 = PRESETS2D["Sod-radial"];
  const [preset, setPreset]   = useState("Sod-radial");
  const [Nx, setNx]           = useState(P0.N);
  const [Ny, setNy]           = useState(P0.N);
  const [gamma, setGamma]     = useState(P0.gamma);
  const [cfl, setCfl]         = useState(P0.cfl);
  const [tEnd, setTEnd]       = useState(P0.tEnd);
  const [flux, setFlux]       = useState("HLLC");
  const [viewMode, setViewMode] = useState("density");
  const [smooth, setSmooth]   = useState(true);
  const [showSlices, setShowSlices] = useState(true);
  const [hover, setHover]     = useState(null);
  const [cutF, setCutF]       = useState({ x: 0.5, y: 0.5 });   // cut position as a fraction of the domain
  const [help, setHelp]       = useState(false);
  const [err, setErr]         = useState(null);

  const [player, startPlayer] = usePlayer();
  const solved = useRef({ key: null, params: null, run: 0 });

  const { Lx, Ly } = PRESETS2D[preset];
  const params = useMemo(() => ({ preset, Nx, Ny, Lx, Ly, gamma, cfl, tEnd, flux }),
                         [preset, Nx, Ny, Lx, Ly, gamma, cfl, tEnd, flux]);
  const stale = !!player && solved.current.key !== JSON.stringify(params);

  const validate = P => {
    if (!(P.gamma > 1))                  return "γ must be greater than 1.";
    if (!(P.cfl > 0 && P.cfl <= 0.9))    return "CFL must be in (0, 0.9].";
    if (!(P.Nx >= 20 && P.Nx <= 400))    return "Nx must be in [20, 400].";
    if (!(P.Ny >= 20 && P.Ny <= 400))    return "Ny must be in [20, 400].";
    if (!(P.tEnd > 0))                   return "t_end must be positive.";
    return null;
  };

  const run = (mode, P) => {
    P = P || params;
    const e = validate(P); setErr(e); if (e) return;
    solved.current = { key: JSON.stringify(P), params: P, run: solved.current.run + 1 };
    const init = PRESETS2D[P.preset].init;
    startPlayer({
      tEnd: P.tEnd, maxFrames: framesFor(P.Nx, P.Ny), playSeconds: 8,
      init: () => initState2D({ Nx: P.Nx, Ny: P.Ny, Lx: P.Lx, Ly: P.Ly, gamma: P.gamma,
                                cfl: P.cfl, flux: P.flux, initFn: init }),
      advance: (s, t) => stepUntil2D(s, t),
      stableDt: stableDt2D,
      record: record2D,
      check: check2D
    }, mode);
  };

  const loadPreset = name => {
    const q = PRESETS2D[name];
    setPreset(name); setNx(q.N); setNy(q.N); setGamma(q.gamma); setCfl(q.cfl); setTEnd(q.tEnd);
    run("solve", { preset: name, Nx: q.N, Ny: q.N, Lx: q.Lx, Ly: q.Ly, gamma: q.gamma, cfl: q.cfl, tEnd: q.tEnd, flux });
  };

  useEffect(() => { run("solve"); /* eslint-disable-next-line */ }, []);
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") setHelp(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  useShortcuts({
    "Enter": () => run("solve"),
    " ": () => (player && !stale ? player.toggle() : run("play")),
    "ArrowLeft": () => player && player.stepFrame(-1),
    "ArrowRight": () => player && player.stepFrame(1),
    "Home": () => player && player.seek(0),
    "End": () => player && player.seek(player.tEnd),
    "?": () => setHelp(h => !h)
  });

  const SP = solved.current.params;
  const frame = player ? player.current() : null;
  const sol = useMemo(() => {
    if (!frame || !SP) return null;
    return extract2D(Object.assign({ Nx: SP.Nx, Ny: SP.Ny, dx: SP.Lx / SP.Nx, dy: SP.Ly / SP.Ny, gamma: SP.gamma },
                                   frame.snap));
  }, [frame, SP]);

  const field = useMemo(() => !sol ? null
    : viewMode === "pressure" ? sol.p
    : viewMode === "Mach" ? sol.M
    : viewMode === "schlieren" ? schlieren2D(sol)
    : sol.rho, [sol, viewMode]);
  const [flo, fhi] = finiteRange([field]);
  const [lo, hi] = useSmoothRange(flo, fhi, solved.current.run + viewMode);

  const SLx = SP ? SP.Lx : Lx, SLy = SP ? SP.Ly : Ly;
  const cut = { x: cutF.x * SLx, y: cutF.y * SLy };
  const slices = useMemo(() => {
    if (!sol || !showSlices) return null;
    const j = Math.max(0, Math.min(sol.Ny - 1, Math.floor(cutF.y * sol.Ny)));
    const i = Math.max(0, Math.min(sol.Nx - 1, Math.floor(cutF.x * sol.Nx)));
    return {
      xs: sol.xs, ys: sol.ys, yAt: sol.ys[j], xAt: sol.xs[i],
      rhoX: slice2D(sol.rho, sol.Nx, sol.Ny, "x", j), pX: slice2D(sol.p, sol.Nx, sol.Ny, "x", j),
      rhoY: slice2D(sol.rho, sol.Nx, sol.Ny, "y", i), pY: slice2D(sol.p, sol.Nx, sol.Ny, "y", i)
    };
  }, [sol, showSlices, cutF]);

  let probe = null, where = "";
  if (sol && hover) {
    const i = Math.max(0, Math.min(sol.Nx - 1, Math.floor(hover.x / SLx * sol.Nx)));
    const j = Math.max(0, Math.min(sol.Ny - 1, Math.floor(hover.y / SLy * sol.Ny)));
    const k = j * sol.Nx + i;
    where = "(" + fmt(sol.xs[i], 3) + ", " + fmt(sol.ys[j], 3) + ")";
    probe = [["ρ", sol.rho[k]], ["u", sol.u[k]], ["v", sol.v[k]], ["p", sol.p[k]], ["M", sol.M[k]]];
  }

  const resetKey = solved.current.run;
  // Line-outs share the hover probe: along-x plots drive hover.x on the y-cut, and vice versa.
  const hoverAlongX = v => setHover(v == null ? null : { x: v, y: cut.y });
  const hoverAlongY = v => setHover(v == null ? null : { x: cut.x, y: v });
  const modeLabel = { density: "density ρ", schlieren: "schlieren |∇ρ|", pressure: "pressure p", Mach: "Mach |u|/a" }[viewMode];

  return (
    <div className="app">
      <TopBar active="2d" scheme={flux + " · MUSCL–minmod · SSP-RK2 · dimension-by-dimension"} onHelp={() => setHelp(h => !h)} />
      <div className="workspace">
        <aside className="rail">
          <p className="rail-intro">
            Full 2D compressible Euler on a Cartesian grid. Click the field to move the line-out cuts.
          </p>
          <Section title="Preset">
            <div className="presets">
              {Object.keys(PRESETS2D).map(name => (
                <button key={name} className={"preset" + (preset === name ? " on" : "")}
                        onClick={() => loadPreset(name)}>{name}</button>
              ))}
            </div>
            <div className="note">Domain {Lx} × {Ly} · transmissive boundaries on all four sides.</div>
          </Section>
          <Section title="Numerics">
            <SelectField label="Riemann flux" value={flux} onChange={setFlux} options={FLUX_OPTIONS} />
            <div className="grid-3">
              <NumField label="Nx" value={Nx} onChange={v => setNx(Math.round(v))} step={20} />
              <NumField label="Ny" value={Ny} onChange={v => setNy(Math.round(v))} step={20} />
              <NumField label="CFL" value={cfl} onChange={setCfl} step={0.05} />
              <NumField label="t end" value={tEnd} onChange={setTEnd} step={0.05} />
              <NumField label="γ" value={gamma} onChange={setGamma} step={0.05} />
            </div>
            {cfl > CFL_SAFE && <div className="note" style={{ color: "var(--accent-2)" }}>
              CFL above {CFL_SAFE} is past the usual MUSCL + RK2 margin.</div>}
            <div className="note">{framesFor(Nx, Ny)} recorded frames at this grid size.</div>
          </Section>
          <Section title="Display">
            <Segmented label="Field" value={viewMode} onChange={setViewMode}
                       options={[{ value: "density", label: "ρ" }, { value: "schlieren", label: "schlieren" },
                                 { value: "pressure", label: "p" }, { value: "Mach", label: "M" }]} />
            <Toggle checked={smooth} onChange={setSmooth} label="smooth interpolation" />
            <Toggle checked={showSlices} onChange={setShowSlices} label="line-outs along the cuts" />
            <button className="btn" onClick={() => setCutF({ x: 0.5, y: 0.5 })}>Reset cuts to centre</button>
          </Section>
          <Section title="Export">
            <button className="btn" disabled={!sol}
                    onClick={() => downloadText(preset.replace(/[^A-Za-z0-9._-]+/g, "_") + "_t=" + frame.t.toExponential(3) + ".csv",
                                                fields2DToCSV(sol, frame.t, preset), "text/csv")}>Export CSV (current time)</button>
            <div className="note">All cells: x, y, ρ, u, v, p, M (non-dimensional).</div>
          </Section>
        </aside>

        <main className="main">
          <Transport player={player} stale={stale}
                     onSolve={() => run("solve")} onPlay={() => run("play")}
                     info={frame ? frame.step + " steps · " + Math.round(player.computeMs) + " ms" : null} />
          {stale && <div className="note">Parameters changed — press <b>Solve</b> (Enter) to recompute.</div>}
          {err && <div className="alert">{err}</div>}
          {player && player.error && <div className="alert">{player.error} Try HLLC / HLL / Rusanov or a lower CFL.</div>}

          <section className="stage">
            <div className="stage-head">
              <span className="stage-title">{preset}</span>
              <span className="muted">{modeLabel} · {SP ? SP.Nx + " × " + SP.Ny : ""}</span>
              <span className="muted" style={{ marginLeft: "auto" }}>
                cuts at x = {fmt(cut.x, 3)}, y = {fmt(cut.y, 3)}</span>
            </div>
            <div className="stage-body">
              <Heatmap sol={sol} field={field} lo={lo} hi={hi} Lx={SLx} Ly={SLy} smooth={smooth}
                       cut={cut} hover={hover} onHover={setHover}
                       onCut={p => setCutF({ x: p.x / SLx, y: p.y / SLy })} />
            </div>
            <div className="stage-foot">
              <Colorbar lo={lo} hi={hi} label={modeLabel} />
              <Probe items={probe} where={where} />
            </div>
          </section>

          {slices && (
            <div className="plots">
              <PlotCard title={"density ρ along x (y = " + fmt(slices.yAt, 3) + ")"} x={slices.xs} y={slices.rhoX}
                        hoverX={hover ? hover.x : null} onHover={hoverAlongX} resetKey={resetKey + "rx" + cutF.y} />
              <PlotCard title={"pressure p along x (y = " + fmt(slices.yAt, 3) + ")"} x={slices.xs} y={slices.pX}
                        hoverX={hover ? hover.x : null} onHover={hoverAlongX} resetKey={resetKey + "px" + cutF.y} />
              <PlotCard title={"density ρ along y (x = " + fmt(slices.xAt, 3) + ")"} x={slices.ys} y={slices.rhoY}
                        hoverX={hover ? hover.y : null} onHover={hoverAlongY} resetKey={resetKey + "ry" + cutF.x} />
              <PlotCard title={"pressure p along y (x = " + fmt(slices.xAt, 3) + ")"} x={slices.ys} y={slices.pY}
                        hoverX={hover ? hover.y : null} onHover={hoverAlongY} resetKey={resetKey + "py" + cutF.x} />
            </div>
          )}
          <footer className="note">∂U/∂t + ∂F/∂x + ∂G/∂y = 0 · U = [ρ, ρu, ρv, E] · finite volume, 2D Cartesian, ideal gas</footer>
        </main>
      </div>

      <HelpDrawer open={help} onClose={() => setHelp(false)}>
        <h2>2D field</h2>
        <p>Full 2D compressible Euler on a Cartesian grid, solved dimension by dimension with the same Riemann
          solvers as the 1D lab.</p>
        <p>Presets: a radial Sod problem (should stay circular — any anisotropy is numerical), the Lax–Liu
          four-quadrant Riemann problem (configuration 3), the Sedov point blast (a positivity stress test), and a
          Kelvin–Helmholtz shear layer (sensitive to numerical dissipation — compare fluxes).</p>
        <h3>Workflow</h3>
        <p>Pick a preset (it solves immediately) or edit and press <b>Solve</b>. Computation runs in small slices
          between animation frames, so the page stays responsive; afterwards <b>Play</b> replays the run and the
          timeline scrubs it. Click the field to place the two cuts; the line-outs follow. Hover to probe.</p>
      </HelpDrawer>
    </div>
  );
}

if (!window.__eulerRoot) {
  window.__eulerRoot = ReactDOM.createRoot(document.getElementById("root"));
}
window.__eulerRoot.render(<App />);
</script>

<!-- Resilience net: if @babel/standalone finishes loading AFTER DOMContentLoaded,
     its automatic transform of the text/babel script never fires and the page
     stays on "Loading...". -->
<script>
// Runs only after the page has loaded and only if the app script never
// started (window.__eulerBooted), so it can't execute the app twice.
window.addEventListener('load', function () {
  (function ensureBabelRuns(tries){
    if (window.__eulerBooted) return;
    if (window.Babel && window.React && window.ReactDOM) {
      try { window.Babel.transformScriptTags(); } catch (e) {}
    }
    if (!window.__eulerBooted && tries < 60) {
      setTimeout(function(){ ensureBabelRuns(tries + 1); }, 120);
    }
  })(0);
});
</script>
</body>
</html>
